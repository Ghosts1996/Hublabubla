<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c12" />
  <title>Vibe — музыка без границ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Vibe, на главную"><span class="brand-mark">✦</span><span>vibe</span></a>
      <nav aria-label="Основная навигация">
        <p class="nav-label">Меню</p>
        <a class="nav-item active" href="#discover" data-view="discover"><span>◈</span>Обзор</a>
        <a class="nav-item" href="#wave" data-view="wave"><span>◒</span>Моя волна</a>
        <a class="nav-item" href="#search" data-view="search"><span>⌕</span>Поиск</a>
        <a class="nav-item" href="#library" data-view="library"><span>▣</span>Моя музыка</a>
      </nav>
      <nav aria-label="Моя коллекция">
        <p class="nav-label">Твоя коллекция</p>
        <a class="nav-item" href="#liked" data-view="liked"><span>♡</span>Любимые треки <b id="likedCount">0</b></a>
        <a class="nav-item" href="#queue" data-view="queue"><span>≡</span>Очередь <b id="queueCount">0</b></a>
        <a class="nav-item" href="#imports" data-view="imports"><span>↥</span>Добавить музыку</a>
      </nav>
      <div class="sidebar-bottom"><button class="profile"><span class="avatar">G</span><span><strong>Гость</strong><small>Бесплатный аккаунт</small></span><span>⋯</span></button></div>
    </aside>

    <main class="main-content">
      <header class="topbar"><button class="mobile-menu" aria-label="Открыть меню">☰</button><div class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Что хочешь послушать?" aria-label="Поиск музыки" /><kbd>⌘ K</kbd></div><button class="icon-button" title="Справка" onclick="location.hash='imports'">?</button><a class="upgrade-button" href="#imports">Добавить музыку <span>↗</span></a></header>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="view"></div>
    </main>
  </div>

  <footer class="player" id="miniPlayer">
    <div class="now-playing"><button id="openPlayer" class="player-summary" aria-label="Открыть плеер"><span id="playerCover" class="mini-cover gradient-1">✦</span><span class="track-meta"><strong id="playerTitle">Выбери свой вайб</strong><span id="playerArtist">Здесь будет играть музыка</span></span></button><button id="playerLike" class="like-button" aria-label="Добавить в любимые">♡</button></div>
    <div class="player-center"><div class="controls"><button id="shuffleBtn" aria-label="Перемешать">⤨</button><button id="prevBtn" aria-label="Предыдущий трек">◀◀</button><button id="playBtn" class="play-button" aria-label="Воспроизвести">▶</button><button id="nextBtn" aria-label="Следующий трек">▶▶</button><button id="repeatBtn" aria-label="Повтор">↻</button></div><div class="progress-row"><span id="currentTime">0:00</span><input id="progress" type="range" min="0" max="100" value="0" aria-label="Прогресс трека"><span id="duration">0:00</span></div></div>
    <div class="player-options"><span>♫</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость"><button id="queueBtn" aria-label="Открыть очередь">≡</button></div>
  </footer>
    <section id="fullPlayer" class="full-player" hidden aria-label="Полноэкранный плеер" aria-modal="true" role="dialog">
      <button id="closePlayer" class="full-player-close" aria-label="Закрыть плеер">⌄</button>
      <div id="fullCover" class="full-cover gradient-1">✦</div>
      <div class="full-meta"><strong id="fullTitle">Выбери свой вайб</strong><span id="fullArtist">Здесь будет играть музыка</span></div>
      <div class="full-progress"><span id="fullCurrent">0:00</span><input id="fullProgress" type="range" min="0" max="100" value="0" aria-label="Прогресс трека"><span id="fullDuration">0:00</span></div>
      <div class="full-controls"><button id="fullShuffle" aria-label="Перемешать">⤨</button><button id="fullPrev" aria-label="Предыдущий трек">◀◀</button><button id="fullPlay" class="full-play" aria-label="Воспроизвести">▶</button><button id="fullNext" aria-label="Следующий трек">▶▶</button><button id="fullRepeat" aria-label="Повтор">↻</button></div>
      <div class="full-actions"><button id="fullLike">♡ Любимое</button><button id="fullQueue">≡ Очередь</button><button id="fullLyrics" aria-expanded="false" aria-controls="lyricsPanel">Текст</button></div>
      <section id="lyricsPanel" class="lyrics-panel" hidden aria-label="Текст песни"><p id="lyricsStatus" role="status"></p><pre id="lyricsText"></pre><small>Источник: LRCLIB. Текст может отсутствовать для этой записи.</small></section>
    </section>

  <audio id="audio"></audio>
  <script src="app.js"></script>
</body>
</html>
